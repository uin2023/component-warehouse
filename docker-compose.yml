# ============================================================
#  RCL Studio —— 电子元器件仓库管理系统
#  飞牛 NAS（fnOS）/ 任意 Docker 主机通用
#
#  用法一（推荐，国内网络最稳）：
#    1. 在 NAS 上新建一个文件夹（如 docker/rcl-studio）
#    2. 把本仓库的 4 个文件按原结构放进去：
#         Dockerfile
#         docker-compose.yml
#         index.html
#         deploy/nginx.conf
#    3. fnOS → Docker → Compose → 添加项目，选中该目录启动
#    4. 浏览器访问  http://NAS的IP:8360
#
#  用法二（NAS 能顺畅访问 GitHub 时，零文件上传）：
#    把下面的 build: . 换成：
#      build: https://github.com/uin2023/component-warehouse.git#main
#
#  端口冲突时，把左侧 8360 改成任意空闲端口即可。
# ============================================================
services:
  rcl-studio:
    build: .
    image: rcl-studio:latest
    container_name: rcl-studio
    restart: unless-stopped
    ports:
      - "8360:80"
